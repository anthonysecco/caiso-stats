name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "23 14 * * *" # daily live-feed check catches CAISO format changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: pytest -v

  live:
    name: Live CAISO feeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: python scripts/check_live.py
